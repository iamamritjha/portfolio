<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d"/>
      <stop offset="100%" stop-color="#f6ad55"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
    <linearGradient id="glassesGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Developer Body / Hoodie -->
  <path d="M14 60 C14 47 22 43 32 43 C42 43 50 47 50 60 Z" fill="#27272a"/>
  <!-- Hoodie inner collar / tshirt -->
  <path d="M26 44 L32 52 L38 44 Z" fill="#18181b"/>
  <!-- Laptop top edge / keyboard glowing -->
  <path d="M20 56 L44 56 L46 62 L18 62 Z" fill="#3f3f46" stroke="#71717a" stroke-width="0.8"/>
  <rect x="25" y="58" width="14" height="2" rx="1" fill="#38bdf8"/>

  <!-- Neck -->
  <rect x="28" y="38" width="8" height="8" rx="2" fill="#ed8936"/>

  <!-- Face -->
  <rect x="20" y="19" width="24" height="23" rx="11" fill="url(#skinGrad)"/>

  <!-- Ears -->
  <circle cx="19" cy="30" r="3.5" fill="#f6ad55"/>
  <circle cx="45" cy="30" r="3.5" fill="#f6ad55"/>

  <!-- Hair -->
  <path d="M19 24 C19 14 24 10 32 10 C40 10 45 14 45 24 C41 21 37 20 32 20 C26 20 22 22 19 24 Z" fill="url(#hairGrad)"/>
  <!-- Sideburns -->
  <path d="M19 23 L21 28 L23 25 Z" fill="#1a202c"/>
  <path d="M45 23 L43 28 L41 25 Z" fill="#1a202c"/>

  <!-- Developer Glasses -->
  <!-- Left frame -->
  <rect x="21" y="25" width="9" height="7" rx="3" fill="#09090b" stroke="#000000" stroke-width="1.2"/>
  <rect x="22.5" y="26" width="6" height="5" rx="2" fill="url(#glassesGlow)" opacity="0.9"/>
  <line x1="23.5" y1="27" x2="26" y2="27" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- Right frame -->
  <rect x="34" y="25" width="9" height="7" rx="3" fill="#09090b" stroke="#000000" stroke-width="1.2"/>
  <rect x="35.5" y="26" width="6" height="5" rx="2" fill="url(#glassesGlow)" opacity="0.9"/>
  <line x1="36.5" y1="27" x2="39" y2="27" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>

  <!-- Bridge -->
  <line x1="30" y1="28" x2="34" y2="28" stroke="#09090b" stroke-width="1.5"/>

  <!-- Nose -->
  <circle cx="32" cy="34" r="1.2" fill="#dd6b20"/>

  <!-- Smile -->
  <path d="M28 36 Q32 39 36 36" stroke="#9c4221" stroke-width="1.3" stroke-linecap="round" fill="none"/>

  <!-- Small Code Bracket Badge at top right -->
  <circle cx="51" cy="13" r="8.5" fill="#09090b" stroke="#10b981" stroke-width="1.5"/>
  <text x="51" y="16.5" font-family="monospace" font-size="7" font-weight="bold" fill="#10b981" text-anchor="middle">&lt;/&gt;</text>
</svg>
